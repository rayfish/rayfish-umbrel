name: docker

on:
  workflow_dispatch:
    inputs:
      ray_ref:
        description: Published Rayfish release tag
        required: true
        default: v0.5.5
      image_tag:
        description: Umbrel image tag
        required: true
        default: v0.5.5-umbrel.1

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RAY_REF=${{ inputs.ray_ref }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/rayfish-umbrel:${{ inputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/rayfish-umbrel:latest
